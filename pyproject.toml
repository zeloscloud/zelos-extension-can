[project]
name = "zelos-extension-can"
version = "0.4.0"
description = "Capture, decode (DBC) and send CAN and CAN-FD frames live, and convert CAN logs (.asc, .blf, .trc, .log, .csv, .mf4) to Zelos traces (.trz), with or without a DBC."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zelos", "extension"]
dependencies = [
    # A prerelease floor, so a resolver considers zelos-sdk prereleases at all.
    "zelos-sdk>=0.0.13a1",
    # The serial extra brings pyserial, which slcan detection needs.
    "python-can[serial]",
    "rich-click>=1.8.0",
    "pyarrow>=14.0.0",
    # 0.0.11a13 runs every python-can interface on the Rust codec.
    "zelos-can[python-can]>=0.0.11a13",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-can"
Repository = "https://github.com/zeloscloud/zelos-extension-can"
Issues = "https://github.com/zeloscloud/zelos-extension-can/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[project.optional-dependencies]
# libusb-package bundles the native libusb-1.0, which pip cannot install.
gs_usb = [
    "gs-usb>=0.3.1",
    "libusb-package>=1.0.26",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_can"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
